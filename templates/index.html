<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tri-Modal Document Interaction System">
    <title>Document Research Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header id="app-header">
        <div class="header-left">
            <div class="logo-icon">📄</div>
            <div>
                <h1>Document Research Assistant</h1>
                <p class="subtitle">Extract metadata & chat with scientific manuscripts</p>
            </div>
        </div>
        <div class="header-right">
            <button id="togglePanelBtn" class="btn-ghost" title="Toggle Metadata Panel">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19V5l-7 7 7 7zM15 19V5l7 7-7 7z"/></svg>
                Metadata
            </button>
            <span class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span id="statusText">Ready</span>
            </span>
        </div>
    </header>

    <main id="chat-container">
        <!-- Main Chat Area -->
        <section id="chat-area">
            <div id="messagesContainer">
                <div class="message system-message">
                    <div class="message-content">
                        Welcome! Please upload a manuscript (PDF, TXT, DOCX) to extract metadata or begin a chat.
                    </div>
                </div>
            </div>
            
            <div class="chat-input-wrapper">
                <div class="chat-input-container">
                    <button id="attachBtn" class="btn-icon" title="Attach Document">📎</button>
                    <input type="file" id="fileInput" accept=".pdf,.txt,.docx" hidden>
                    <input type="text" id="chatInput" placeholder="Type a message or trigger extraction..." autocomplete="off">
                    <button id="stopBtn" class="btn-icon stop-btn hidden" title="Stop Generation">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    </button>
                    <button id="sendBtn" class="btn-icon send-btn" title="Send Message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
                <div id="uploadProgress" class="upload-progress hidden">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-label" id="progressLabel"></span>
                </div>
            </div>
        </section>

        <!-- Metadata Side Panel -->
        <section id="metadata-panel" class="panel">
            <div class="panel-header">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <h2>📋 Metadata</h2>
                    <span id="panelStats" class="badge">
                        <span id="statExtracted">0</span>/<span id="statTotal">0</span>
                    </span>
                </div>
                <div class="header-actions">
                    <button id="expandAllBtn" class="btn-ghost btn-sm">Expand All</button>
                    <button id="collapseAllBtn" class="btn-ghost btn-sm">Collapse All</button>
                    <button id="closePanelBtn" class="btn-icon btn-sm" title="Close Panel">✕</button>
                </div>
            </div>

            <div id="resultsContainer" class="results-container">
                <div id="metadataContent" class="metadata-content">
                    <div id="groupsContainer"></div>
                </div>
                <div class="panel-footer" style="padding: 1rem; border-top: 1px solid var(--border);">
                    <button id="downloadBtn" class="btn-ghost w-100" title="Download JSON">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        Download JSON
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const attachBtn = document.getElementById('attachBtn');
        const fileInput = document.getElementById('fileInput');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressFill = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');
        
        const metadataPanel = document.getElementById('metadata-panel');
        const groupsContainer = document.getElementById('groupsContainer');
        
        const downloadBtn = document.getElementById('downloadBtn');
        
        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const togglePanelBtn = document.getElementById('togglePanelBtn');
        const closePanelBtn = document.getElementById('closePanelBtn');
        const statExtracted = document.getElementById('statExtracted');
        const statTotal = document.getElementById('statTotal');
        const statNull = { textContent: '0' }; // Placeholder for compatibility

        let schemaData = null;
        let extractedMetadata = null;
        let isProcessing = false;
        let currentAbortController = null;
        let pendingUserPrompt = '';
        let extractionInProgress = false;

        // --- T12: UI Lock during extraction ---
        function setExtractionLock(locked) {
            extractionInProgress = locked;

            // Lock chat controls
            chatInput.disabled = locked;
            sendBtn.disabled = locked;
            attachBtn.disabled = locked;

            // Lock all form inputs in metadata panel
            document.querySelectorAll('.field-dropdown, .dropdown-search, .inline-edit-input').forEach(el => {
                el.disabled = locked;
                if (locked) el.style.opacity = '0.5';
                else el.style.opacity = '1';
            });

            // Hide/show Ask AI buttons
            document.querySelectorAll('.ask-ai-btn').forEach(btn => {
                btn.style.display = locked ? 'none' : '';
            });

            // Update status indicator
            if (statusText) statusText.textContent = locked ? 'Processing…' : 'Ready';
            const dot = document.querySelector('.status-dot');
            if (dot) {
                dot.style.backgroundColor = locked ? 'var(--conf-med)' : 'var(--primary)';
                dot.style.boxShadow = locked ? '0 0 8px var(--conf-med)' : '0 0 8px var(--primary)';
            }
        }

        let userModifiedFields = new Set();

        async function init() {
            try {
                const res = await fetch('/api/schema');
                schemaData = await res.json();
                renderEmptySchema();
            } catch (err) {
                console.error("Failed to load schema", err);
            }
        }

        function updateStats(extracted, nulls, total) {
            if (statExtracted) statExtracted.textContent = extracted;
            if (statTotal) statTotal.textContent = total;
        }

        function renderEmptySchema() {
            const groups = schemaData.field_groups || schemaData.groups || [];
            if (!groups.length) return;
            groupsContainer.innerHTML = '';
            let totalFields = 0;
            
            groups.forEach(group => {
                const groupName = group.group_name || group.name;
                const groupEl = document.createElement('div');
                groupEl.className = 'metadata-group expanded';
                
                const header = document.createElement('div');
                header.className = 'group-header';
                const fieldCount = (group.fields || []).length;
                totalFields += fieldCount;
                
                header.innerHTML = `
                    <div class="group-title">
                        <span class="chevron">▼</span>
                        ${groupName}
                    </div>
                    <div class="group-stats">
                        <span id="stats-${groupName.replace(/\W/g, '')}">0</span>/${fieldCount}
                    </div>
                `;
                header.addEventListener('click', () => {
                    groupEl.classList.toggle('expanded');
                });
                
                const fieldsContainer = document.createElement('div');
                fieldsContainer.className = 'group-fields';
                
                group.fields.forEach(field => {
                    const fieldEl = document.createElement('div');
                    fieldEl.className = 'field-row';
                    
                    const nameElem = document.createElement('div');
                    nameElem.className = 'field-name';
                    nameElem.textContent = field.name;
                    nameElem.title = field.description || "";
                    
                    const valElem = document.createElement('div');
                    valElem.className = 'field-value';
                    valElem.id = `field-val-${groupName.replace(/\W/g, '')}-${field.name.replace(/\W/g, '')}`;
                    
                    // Create Dropdown or Input
                    if (field.text_values) {
                        const dropdown = createSearchableDropdown(groupName, field.name, "", field.text_values);
                        valElem.appendChild(dropdown);
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'inline-edit-input field-dropdown';
                        input.placeholder = '— Select —';
                        input.addEventListener('change', () => {
                            userModifiedFields.add(`${groupName}.${field.name}`);
                            saveField(groupName, field.name, input.value, 'user-provided');
                        });
                        valElem.appendChild(input);
                    }
                    
                    const metaActions = document.createElement('div');
                    metaActions.className = 'field-actions hidden';
                    metaActions.id = `field-actions-${groupName.replace(/\W/g, '')}-${field.name.replace(/\W/g, '')}`;
                    
                    valElem.appendChild(metaActions);
                    
                    fieldEl.appendChild(nameElem);
                    fieldEl.appendChild(valElem);
                    fieldsContainer.appendChild(fieldEl);
                });
                
                groupEl.appendChild(header);
                groupEl.appendChild(fieldsContainer);
                groupsContainer.appendChild(groupEl);
            });
            
            updateStats(0, totalFields, totalFields);
        }

        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async function() {
            if (this.files && this.files.length) {
                const file = this.files[0];
                await uploadFile(file);
                this.value = ''; // Reset input
            }
        });

        async function uploadFile(file) {
            addSystemMessage(`📄 Uploading: ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB)...`);
            uploadProgress.classList.remove('hidden');
            progressLabel.textContent = 'Uploading...';
            progressFill.style.width = '10%';
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.error || 'Upload failed');
                }
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let sseBuffer = "";
                
                const progressMap = {
                    'processing': '15%',
                    'analyzing': '30%',
                    'indexing': '50%',
                    'extracting': '70%',
                    'refining': '85%',
                    'metadata': '90%',
                    'complete': '100%'
                };

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    sseBuffer += decoder.decode(value, { stream: true });
                    const lines = sseBuffer.split('\n\n');
                    sseBuffer = lines.pop(); // keep remainder
                    
                    for (const block of lines) {
                        if (!block.trim()) continue;
                        if (block.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(block.substring(6));
                                if (data.error) {
                                    throw new Error(data.error);
                                }
                                
                                // Lock/unlock UI
                                if (data.stage === 'lock_ui') {
                                    setExtractionLock(true);
                                }
                                if (data.stage === 'unlock_ui') {
                                    setExtractionLock(false);
                                }
                                
                                if (data.stage && progressMap[data.stage]) {
                                    progressFill.style.width = progressMap[data.stage];
                                }
                                
                                if (data.message) {
                                    progressLabel.textContent = data.message;
                                }
                                
                                if (data.stage === 'metadata' && data.metadata) {
                                    extractedMetadata = data.metadata;
                                    renderMetadata(extractedMetadata);
                                    metadataPanel.classList.remove('hidden');
                                }
                                
                                if (data.stage === 'complete') {
                                    addSystemMessage(`✅ Document "${data.filename}" processed successfully. You can now ask questions or review metadata.`);
                                    setTimeout(() => uploadProgress.classList.add('hidden'), 2000);
                                }
                            } catch (e) {
                                console.error("Error parsing SSE JSON", e, block);
                            }
                        }
                    }
                }
                
            } catch (err) {
                addSystemMessage(`❌ Error: ${err.message}`);
                uploadProgress.classList.add('hidden');
            }
        }

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) {
                sendMessage(chatInput.value);
            }
        });

        sendBtn.addEventListener('click', () => {
            if (!isProcessing) {
                sendMessage(chatInput.value);
            }
        });

        async function sendMessage(msg) {
            const text = msg.trim();
            if (!text) return;

            pendingUserPrompt = text;

            addUserMessage(text);
            chatInput.value = '';

            isProcessing = true;
            statusText.textContent = "Processing...";
            statusIndicator.classList.add("processing");
            chatInput.disabled = true;
            sendBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');

            currentAbortController = new AbortController();
            const signal = currentAbortController.signal;

            const assistantMsgElem = createAssistantMessageElem();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                    signal: signal
                });

                if (!res.ok) {
                    const data = await res.json();
                    assistantMsgElem.innerHTML = `<span style="color: #ff6b6b">Error: ${data.error}</span>`;
                    scrollToBottom();
                    setReady();
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = "";
                let currentMode = "";
                let sseBuffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    sseBuffer += decoder.decode(value, { stream: true });
                    const events = sseBuffer.split('\n\n');
                    sseBuffer = events.pop(); // keep the last potentially incomplete chunk in the buffer

                    for (const event of events) {
                        const lines = event.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const dataStr = line.replace('data: ', '').trim();
                                if (dataStr === '[DONE]') {
                                    continue;
                                }
                                try {
                                    const dataObj = JSON.parse(dataStr);
                                    if (dataObj.error) {
                                        assistantMsgElem.innerHTML += `<span style="color: #ff6b6b">Error: ${dataObj.error}</span>`;
                                        continue;
                                    }
                                    if (dataObj.status === 'extracting') {
                                        currentMode = dataObj.mode || 'extraction';
                                        assistantMsgElem.innerHTML = `<span style="color: var(--text-muted)">Extracting metadata...</span>`;
                                        continue;
                                    }
                                    if (dataObj.response_metadata) {
                                        extractedMetadata = dataObj.response_metadata;
                                        
                                        const fieldCount = Object.values(extractedMetadata)
                                            .reduce((sum, group) => sum + Object.keys(group).length, 0);
                                            
                                        renderResponseMetadata(extractedMetadata);
                                        metadataPanel.classList.remove('hidden');
                                        
                                        const badge = document.createElement('div');
                                        badge.className = 'metadata-badge';
                                        badge.innerHTML = `📊 <strong>${fieldCount}</strong> metadata fields detected`;
                                        assistantMsgElem.appendChild(badge);
                                        
                                        continue;
                                    }
                                    if (dataObj.content) {
                                        fullContent += dataObj.content;
                                        currentMode = dataObj.mode;
                                        
                                        if (currentMode !== 'extraction') {
                                            assistantMsgElem.innerHTML = marked.parse(fullContent);
                                        }
                                        scrollToBottom();
                                    }
                                } catch (e) {
                                    console.error('Parse error', e, dataStr);
                                }
                            }
                        }
                    }
                }
                
                if (currentMode === 'extraction') {
                    assistantMsgElem.innerHTML = `✅ Metadata extraction complete.`;
                    try {
                        extractedMetadata = JSON.parse(fullContent.trim());
                        renderMetadata(extractedMetadata);
                        metadataPanel.classList.remove('hidden');
                    } catch (e) {
                        assistantMsgElem.innerHTML = `<span style="color: #ff6b6b">Error parsing extraction JSON</span>`;
                    }
                } else if (currentMode === 'hybrid' || currentMode === 'interaction') {
                    // No mode badge — just clean response
                    assistantMsgElem.innerHTML = marked.parse(fullContent);
                }

            } catch (err) {
                if (err.name === 'AbortError') {
                    assistantMsgElem.innerHTML = `<span style="color: var(--text-muted)">Generation stopped.</span>`;
                } else {
                    assistantMsgElem.innerHTML = `<span style="color: #ff6b6b">Request failed: ${err.message}</span>`;
                }
            }
            
            setReady();
        }
        
        stopBtn.addEventListener('click', () => {
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }
            chatInput.value = pendingUserPrompt;
            setReady();
        });
        
        function setReady() {
            isProcessing = false;
            statusText.textContent = "Ready";
            statusIndicator.classList.remove("processing");
            chatInput.disabled = false;
            sendBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            chatInput.focus();
            scrollToBottom();
            currentAbortController = null;
        }

        function addUserMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message user-message';
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            wrapper.appendChild(content);
            messagesContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function createAssistantMessageElem() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message assistant-message';
            const content = document.createElement('div');
            content.className = 'message-content typing-indicator-container';
            content.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            wrapper.appendChild(content);
            messagesContainer.appendChild(wrapper);
            scrollToBottom();
            return content;
        }

        function addSystemMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message system-message';
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            wrapper.appendChild(content);
            messagesContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Side Panel Toggle
        togglePanelBtn.addEventListener('click', togglePanel);
        closePanelBtn.addEventListener('click', togglePanel);

        function togglePanel() {
            metadataPanel.classList.toggle('hidden');
        }

        // --- Metadata Rendering Logic ---
        function renderMetadata(data) {
            let extractedCount = 0;
            let nullCount = 0;
            let totalCount = 0;

            const groups = schemaData.field_groups || schemaData.groups || [];
            for (const schemaGroup of groups) {
                const groupName = schemaGroup.group_name || schemaGroup.name;
                const groupData = data[groupName] || {};
                
                let groupFilled = 0;
                let groupTotal = (schemaGroup.fields || []).length;
                totalCount += groupTotal;

                for (const field of (schemaGroup.fields || [])) {
                    const fieldKey = field.name;
                    const fieldData = groupData[fieldKey];
                    const valElemId = `field-val-${groupName.replace(/\W/g, '')}-${fieldKey.replace(/\W/g, '')}`;
                    const valElem = document.getElementById(valElemId);
                    
                    if (!valElem) continue;

                    let hasValue = fieldData && fieldData.value !== null;
                    if (hasValue) {
                        groupFilled++;
                        extractedCount++;
                    } else {
                        nullCount++;
                    }
                    
                    // Only update if not modified by user
                    if (!userModifiedFields.has(`${groupName}.${fieldKey}`)) {
                        const inputOrDropdown = valElem.querySelector('input.dropdown-search') || valElem.querySelector('input.inline-edit-input');
                        if (inputOrDropdown && hasValue) {
                            if (inputOrDropdown.value !== fieldData.value) {
                                inputOrDropdown.value = fieldData.value;
                                inputOrDropdown.classList.add('auto-filled');
                                setTimeout(() => inputOrDropdown.classList.remove('auto-filled'), 1500);
                            }
                        }
                    }

                    // Update actions/badges
                    let actionsElem = document.getElementById(`field-actions-${groupName.replace(/\W/g, '')}-${fieldKey.replace(/\W/g, '')}`);
                    if (actionsElem) {
                        actionsElem.innerHTML = '';
                        actionsElem.classList.remove('hidden');
                        
                        if (!hasValue && !userModifiedFields.has(`${groupName}.${fieldKey}`) && !extractionInProgress) {
                            const suggestBtn = document.createElement('button');
                            suggestBtn.className = 'btn-ghost btn-sm ask-ai-btn';
                            suggestBtn.innerHTML = '✨ Ask AI';
                            suggestBtn.onclick = () => suggestField(groupName, fieldKey);
                            actionsElem.appendChild(suggestBtn);
                        } else if (hasValue && fieldData.confidence) {
                            const confBadge = document.createElement('span');
                            confBadge.className = 'confidence-badge';
                            confBadge.textContent = fieldData.confidence;
                            
                            const cLower = fieldData.confidence.toLowerCase();
                            if (cLower === 'high') confBadge.classList.add('conf-high');
                            else if (cLower === 'medium') confBadge.classList.add('conf-med');
                            else confBadge.classList.add('conf-low');
                            
                            actionsElem.appendChild(confBadge);
                            
                            if (fieldData.evidence) {
                                const evButton = document.createElement('button');
                                evButton.className = 'btn-ghost btn-sm evidence-toggle';
                                evButton.innerHTML = '🔍';
                                evButton.title = 'View evidence';
                                
                                const evPanel = document.createElement('div');
                                evPanel.className = 'evidence-panel hidden';
                                evPanel.innerHTML = `<strong>Evidence:</strong> "${fieldData.evidence}"<br>
                                                     <small>Section: ${fieldData.section || 'Unknown'} | Type: ${fieldData.inference_type || 'Unknown'}</small>`;
                                
                                evButton.onclick = () => evPanel.classList.toggle('hidden');
                                actionsElem.appendChild(evButton);
                                actionsElem.appendChild(evPanel);
                            }
                        }
                    }
                }

                // Update group stats
                const statsElem = document.getElementById(`stats-${groupName.replace(/\W/g, '')}`);
                if (statsElem) {
                    statsElem.textContent = groupFilled;
                }
            }
            
            updateStats(extractedCount, nullCount, totalCount);
        }
        
        function renderResponseMetadata(data) {
            // Keep DOM state interactive by reusing renderMetadata
            renderMetadata(data);
            
            // Re-calc basic count for top-level stats display if needed
            let extractedCount = 0;
            for (const fields of Object.values(data)) {
                extractedCount += Object.keys(fields).length;
            }
            updateStats(extractedCount, 0, extractedCount);
        }
        
        function updateStats(ext = 0, nul = 0, tot = 0) {
            statExtracted.textContent = ext;
            statNull.textContent = nul;
            statTotal.textContent = tot;
        }

        document.getElementById('expandAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.metadata-group').forEach(el => el.classList.add('expanded'));
        });
        
        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.metadata-group').forEach(el => el.classList.remove('expanded'));
        });
        
        downloadBtn.addEventListener('click', () => {
            if (!extractedMetadata) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(extractedMetadata, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "extracted_metadata.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        });

        // --- Suggestion and Edit Logic ---
        function createSearchableDropdown(groupName, fieldKey, currentValue, options) {
            const container = document.createElement('div');
            container.className = 'searchable-dropdown';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'dropdown-search field-dropdown';
            input.value = currentValue || '';
            input.placeholder = '— Select —';
            
            // Portal: append dropdown list to body for overflow escape
            const portal = document.createElement('div');
            portal.className = 'dropdown-portal hidden';
            document.body.appendChild(portal);
            
            function positionPortal() {
                const rect = input.getBoundingClientRect();
                portal.style.top = `${rect.bottom + 2}px`;
                portal.style.left = `${rect.left}px`;
                portal.style.width = `${rect.width}px`;
            }
            
            function renderOptions(filter = '') {
                portal.innerHTML = '';
                const filtered = options.filter(o => 
                    o.toLowerCase().includes(filter.toLowerCase())
                ).slice(0, 20);
                
                filtered.forEach(opt => {
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.textContent = opt;
                    item.addEventListener('click', () => {
                        input.value = opt;
                        portal.classList.add('hidden');
                        userModifiedFields.add(`${groupName}.${fieldKey}`);
                        input.classList.add('user-modified');
                        saveField(groupName, fieldKey, opt, 'user-provided');
                    });
                    portal.appendChild(item);
                });
            }
            
            input.addEventListener('focus', () => {
                positionPortal();
                renderOptions('');
                portal.classList.remove('hidden');
            });
            
            input.addEventListener('input', () => {
                positionPortal();
                renderOptions(input.value);
            });
            
            input.addEventListener('change', () => {
                userModifiedFields.add(`${groupName}.${fieldKey}`);
                input.classList.add('user-modified');
                saveField(groupName, fieldKey, input.value, 'user-provided');
            });
            
            // Close portal on outside click
            document.addEventListener('click', (e) => {
                if (!container.contains(e.target) && !portal.contains(e.target)) {
                    portal.classList.add('hidden');
                }
            });
            
            // Reposition on scroll
            const resultsContainer = document.getElementById('resultsContainer');
            if (resultsContainer) {
                resultsContainer.addEventListener('scroll', () => {
                    if (!portal.classList.contains('hidden')) positionPortal();
                });
            }
            
            // Cleanup portal when element is removed from DOM
            const observer = new MutationObserver(() => {
                if (!document.body.contains(container)) {
                    portal.remove();
                    observer.disconnect();
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
            
            container.appendChild(input);
            return container;
        }

        async function saveField(groupName, fieldKey, value, source) {
            try {
                const res = await fetch('/api/metadata/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ group_name: groupName, field_name: fieldKey, value: value, source: source })
                });
                if (res.ok) {
                    const data = await fetch('/api/metadata').then(r => r.json());
                    extractedMetadata = data;
                    renderMetadata(extractedMetadata);
                }
            } catch (e) {
                console.error("Save error", e);
            }
        }

        async function suggestField(groupName, fieldKey) {
            // No prompt() dialog — AI generates hints automatically
            addSystemMessage(`✨ Getting contextual hints for ${fieldKey}...`);
            
            try {
                const res = await fetch('/api/suggest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ group_name: groupName, field_name: fieldKey })
                });
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let sseBuffer = "";
                let hintsObj = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    sseBuffer += decoder.decode(value, { stream: true });
                    const events = sseBuffer.split('\n\n');
                    sseBuffer = events.pop();

                    for (const event of events) {
                        const lines = event.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const dataStr = line.replace('data: ', '').trim();
                                if (!dataStr || dataStr === '[DONE]') continue;
                                const data = JSON.parse(dataStr);
                                if (data.field_hints) {
                                    hintsObj = data.field_hints;
                                } else if (data.error) {
                                    addSystemMessage(`❌ Hint error: ${data.error}`);
                                    return;
                                }
                            }
                        }
                    }
                }
                
                if (hintsObj && hintsObj.hints && hintsObj.hints.length > 0) {
                    const actionsElem = document.getElementById(`field-actions-${groupName.replace(/\W/g, '')}-${fieldKey.replace(/\W/g, '')}`);
                    if (actionsElem) {
                        actionsElem.innerHTML = '';
                        
                        const hintsPanel = document.createElement('div');
                        hintsPanel.className = 'ai-suggestion-popover';
                        
                        let hintsHTML = '<div style="margin-bottom: 8px;"><strong>💡 Document Hints:</strong></div>';
                        hintsHTML += '<ul style="margin: 0; padding-left: 1.2rem; list-style-type: disc;">';
                        for (const hint of hintsObj.hints) {
                            hintsHTML += `<li style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-style: italic;">${hint}</li>`;
                        }
                        hintsHTML += '</ul>';
                        hintsHTML += '<div style="margin-top: 8px;"><button class="btn-ghost btn-sm dismiss-hints-btn">Dismiss</button></div>';
                        
                        hintsPanel.innerHTML = hintsHTML;
                        
                        hintsPanel.querySelector('.dismiss-hints-btn').onclick = () => {
                            hintsPanel.remove();
                            renderMetadata(extractedMetadata);
                        };
                        
                        actionsElem.appendChild(hintsPanel);
                    }
                } else {
                    addSystemMessage(`💡 No relevant hints found for ${fieldKey} in the document.`);
                }

            } catch (err) {
                addSystemMessage(`❌ Request failed: ${err.message}`);
            }
        }

        // Init
        init();
    </script>
</body>
</html>
